<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHIẾU TÍNH LƯƠNG SẢN PHẨM</title>
    <style>
        /* GIỮ NGUYÊN CSS CŨ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 14px;
            color: #000000;
            background-color: #e7ebfd;
        }

        .page {
            max-width: 1200px;
            min-height: 297mm;
            background: white;
            margin: 10px auto;
            padding: 10mm 5mm;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
            position: relative;
            border-radius: 5px;
            border-top: 3px solid #2b2b2b;
        }

        .editable-input {
            border: none;
            border-bottom: 1px dashed #999;
            background: transparent;
            font-family: inherit;
            font-size: inherit;
            width: 100%;
            outline: none;
            padding: 2px 0;
        }

        .editable-input:focus {
            border-bottom: 1px solid #000;
        }

        .text-center {
            text-align: center !important;
            vertical-align: middle !important;
        }

        .capitalize-input {
            text-transform: capitalize;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            text-align: center;
        }

        .header-left {
            text-align: center;
            font-weight: bold;
            font-size: 0.9em;
        }

        .header-center {
            flex-grow: 1;
        }

        .header-center h2 {
            font-size: 25px;
            margin: 0;
            line-height: 1.2;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 1px solid #464646;
            padding-bottom: 5px;
        }

        .grid-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 30px;
            margin-bottom: 20px;
        }

        .grid-info div {
            display: flex;
            align-items: flex-end;
            padding-bottom: 2px;
            width: 100%;
        }

        .grid-info div label {
            margin-right: 10px;
            white-space: nowrap;
            line-height: 1.2;
            font-weight: bold;
        }

        .required-star {
            color: #dc3545;
        }

        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .details-table th,
        .details-table td {
            border: 1px solid #464646;
            padding: 5px;
            text-align: center;
        }

        .details-table th {
            background-color: #f9f9f9;
            font-weight: bold;
        }

        .details-table input,
        .details-table select {
            border: none;
            width: 100%;
            text-align: center;
            outline: none;
            font-family: inherit;
            font-size: inherit;
            background: transparent;
        }

        .i-thanhtien {
            font-weight: bold;
            text-align: right !important;
        }

        .tong-tien-row {
            font-weight: bold;
            background-color: #f9f9f9;
        }

        .btn-action {
            padding: 2px 8px;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #464646;
            background-color: #fff;
            border-radius: 3px;
            margin: 0 2px;
            font-family: Times New Roman;
        }

        .btn-add {
            margin-top: 5px;
        }

        .btn-action:hover {
            background-color: #e0e0e0;
        }

        .signature-section {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            text-align: center;
            font-weight: bold;
        }

        .signature-box {
            width: 45%;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: auto;
        }

        .action-buttons {
            border-top: 1px solid #464646;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 50px;
            margin-bottom: 10px;
            padding-top: 20px;
        }

        .btn-simple {
            padding: 8px 25px;
            background-color: #fff;
            color: #000;
            border: 1px solid #464646;
            border-radius: 4px;
            cursor: pointer;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.2s;
        }

        .btn-simple:hover {
            background-color: #e0e0e0;
        }

        .btn-simple.primary {
            background-color: #000;
            color: #fff;
        }

        .btn-simple.primary:hover {
            background-color: #333;
        }

        #btnSubmit:disabled {
            background-color: #e0e0e0;
            color: #888;
            cursor: not-allowed;
            border: 1px solid #aaa;
        }

        @media (max-width: 768px) {
            .page {
                width: 100%;
                margin: 0;
                padding: 10px;
                border-top: 3px solid #2b2b2b;
            }

            .header {
                flex-direction: column;
                gap: 10px;
            }

            .grid-info {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .grid-info div[style*="grid-column"] {
                grid-column: span 1 !important;
            }

            .details-table thead {
                display: none;
            }

            .details-table tbody tr {
                display: block;
                margin-bottom: 15px;
                border: 1px solid #464646;
                border-radius: 5px;
                padding: 5px;
            }

            .details-table td {
                display: flex;
                align-items: center;
                justify-content: space-between;
                border: none;
                border-bottom: 1px dashed #ccc;
                text-align: right;
                padding: 8px 5px;
            }

            .details-table td:last-child {
                border-bottom: none;
                justify-content: center;
            }

            .details-table td::before {
                content: attr(data-label);
                font-weight: bold;
                text-align: left;
                flex-basis: 40%;
                white-space: nowrap;
            }

            .details-table input {
                text-align: right;
                width: 60%;
            }

            .details-table .btn-action {
                width: 100%;
                padding: 10px;
                color: #d93025;
                border-color: #d93025;
            }

            .details-table tfoot tr {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 15px 5px;
                border: 1px solid #464646;
                border-radius: 5px;
            }

            .details-table tfoot td {
                border: none;
                padding: 0;
            }

            .tong-tien-row td[colspan="5"] {
                text-align: left !important;
            }

            .tong-tien-row td#tongTienDisplay {
                text-align: right !important;
                font-size: 1.1em;
            }

            .details-table tfoot td.no-print {
                display: none;
            }

            .signature-section {
                flex-direction: column;
                gap: 20px;
            }

            .signature-box {
                width: 100%;
                min-height: 80px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn-simple {
                width: 100%;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm;
            }

            body {
                background: white;
                padding: 0;
            }

            .page {
                box-shadow: none;
                margin: 0;
                width: 100%;
                padding: 10px;
                border-top: none;
            }

            .editable-input {
                flex: 1;
                min-width: 50px;
            }

            input::placeholder {
                color: transparent;
            }

            .action-buttons,
            .no-print {
                display: none !important;
            }

            input[type="date"]::-webkit-calendar-picker-indicator {
                display: none;
            }

            select {
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
            }
        }

        .details-table td[data-label="Tên CĐ *"],
        .i-tencd {
            text-align: left !important;
        }

        .lock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
        }

        .lock-message-box {
            background-color: #fff;
            padding: 30px 40px;
            border: 2px solid #d93025;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            font-size: 18px;
            font-weight: bold;
            color: #d93025;
            text-align: center;
            max-width: 80%;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div id="lockOverlay" class="lock-overlay" style="display: none;">
        <div class="lock-message-box">
            ⚠️ Chưa đến thời điểm kê khai, hệ thống tạm khóa! <br> Xin mời bạn trở lại khi có thông báo chốt sản lượng
            từ Tổ trưởng.
        </div>
    </div>
    <div class="page">
        <div class="header">
            <div class="header-left">
                NHÀ MÁY MAY<br />HÒA THỌ TRIỆU PHONG
            </div>
            <div class="header-center">
                <h2>SẢN LƯỢNG CHỐT LƯƠNG TRONG THÁNG</h2>
            </div>
        </div>

        <div class="section-title">DANH SÁCH CHI TIẾT</div>
        <label>Đang hoàn thiện...</label>

</body>

</html>
